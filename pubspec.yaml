name: lets_vhandar
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.5.0+1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_maps: ^7.1.0
  cached_network_image: ^3.3.1
  # flutter_local_notifications: ^17.2.1+2
  geolocator: ^12.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  flutter_riverpod: ^2.5.1
  flex_color_scheme: ^8.0.0
  google_fonts: ^8.0.1
  go_router: ^14.4.1
  get_it: ^8.0.2
  freezed_annotation: ^2.4.1
  riverpod: ^2.6.1
  pinput: ^5.0.0
  equatable: ^2.0.8
  google_maps_flutter: ^2.7.1
  geocoding: ^4.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.1"
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.5.7

flutter_icons:
  android: "launcher_icon"
  ios: true
  # image_path: "assets/icon/icon.png"
  image_path: "assets/images/vandhar_logo.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff" # You can use a color or image for the background
  adaptive_icon_foreground: "assets/images/vandhar_logo.png" # For adaptive icons on Android

flutter:
  uses-material-design: true

  assets:
    - assets/images/
