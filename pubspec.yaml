name: lets_vhandar
description: "Let's Vhandar - Fresh groceries and daily essentials delivered to your door."

version: 1.0.1+2

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.5.0+1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  intl: ^0.19.0
  google_maps: ^8.2.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  # flutter_local_notifications: ^17.2.1+2
  geolocator: ^12.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  flutter_riverpod: ^2.5.1
  flex_color_scheme: ^8.0.0
  google_fonts: ^8.0.1
  go_router: ^14.4.1
  get_it: ^8.0.2
  freezed_annotation: ^2.4.1
  riverpod: ^2.6.1
  pinput: ^5.0.0
  equatable: ^2.0.8
  google_maps_flutter: ^2.17.1
  geocoding: ^4.0.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.0
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.2
  connectivity_plus: ^7.1.1
  share_plus: ^13.1.0
  path_parsing: ^1.1.0
  fl_chart: ^0.69.0
  pdf: ^3.11.0
  printing: ^5.13.1
  path_provider: ^2.1.4
  # firebase_core: ^3.6.0          # add after running: flutterfire configure
  # firebase_crashlytics: ^4.1.3   # add after running: flutterfire configure


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.1"
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.5.7

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff" # You can use a color or image for the background
  adaptive_icon_foreground: "assets/images/app_icon.png" # For adaptive icons on Android

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

